# Training Control
epochs: 500
patience: 1000
load_model: True

# Architecture
width: 30
dropout_rate: 0.05
predict_residual: False

# Physics
pred_step: 1
alpha: 1.0
beta: 1.0

# Dataset
train_ratio: 0.95
val_ratio: 0.05
trajectories_seed: 42
train_dim: 1383
