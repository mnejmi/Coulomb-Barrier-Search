model_name: "UNO_Transformer_v6_exp4_TSym"
data_dir: "local_data/"
checkpoint_dir: "local_data/UNO_Transformer_v6_exp4_TSym/"
log_dir: "local_data/UNO_Transformer_v6_exp4_TSym/"

batch_size: 1
num_workers: 4
gpus: 1
precision: 32

# Optimizer
learning_rate: 0.0002
weight_decay: 0.0001
